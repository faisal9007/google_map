name: google_map
description: A Flutter app for real-time location tracking

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Google Maps
  google_maps_flutter: ^2.5.0
  google_maps_flutter_android: ^2.5.0
  google_maps_flutter_platform_interface: ^2.4.0

  # Location services
  geolocator: ^10.1.0

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true


